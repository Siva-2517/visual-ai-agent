<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Eye Top Arc Gradient -->
    <linearGradient id="topArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Eye Bottom Arc Gradient -->
    <linearGradient id="bottomArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Iris Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />

  <!-- Eye Outer Arcs -->
  <path d="M 24 64 Q 64 36 104 64" fill="none" stroke="url(#topArcGrad)" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 24 64 Q 64 92 104 64" fill="none" stroke="url(#bottomArcGrad)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Outer Iris -->
  <circle cx="64" cy="64" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />

  <!-- Inner Iris Core (Glowing) -->
  <circle cx="64" cy="64" r="14" fill="#6366f1" filter="url(#glow)" />

  <!-- Pupil White Center -->
  <circle cx="64" cy="64" r="8" fill="#ffffff" />

  <!-- AI Cross Starburst -->
  <line x1="64" y1="46" x2="64" y2="82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="46" y1="64" x2="82" y2="64" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Satellite AI Nodes -->
  <circle cx="24" cy="64" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="104" cy="64" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="64" cy="38" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="64" cy="90" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Pupil Highlight -->
  <circle cx="67" cy="61" r="2.5" fill="#ffffff" />
</svg>
